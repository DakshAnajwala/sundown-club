<script type="module">
import * as THREE from 'three';
import { createLounge, createCameraRig, ROOMS, mat } from '@sundown/shared/lounge/lounge.js';
import { drawFace, drawBack } from '@sundown/shared/lounge/cards3d.js';
import { createSfx } from '@sundown/shared/lounge/sfx.js';
import { fmt, easeInOut } from '@sundown/shared/lounge/util.js';
import { getChips, setBankroll, refill, canRefill } from '@sundown/shared/chips.js';
import { createLeaveGuard } from '@sundown/shared/leave-guard.js';
import { trackPlaytime, updateGame } from '@sundown/shared/profile.js';
import { initTelemetry } from '@sundown/shared/telemetry.js';
import { reportRound, reportSeed, seedResults } from '@sundown/shared/retention.js';
import { makeChallenge, checkChallenge } from '@sundown/shared/leaderboard.js';
import { renderShareCard, shareResult } from '@sundown/shared/sharecard.js';
import { levelFor, titleFor, readProfile } from '@sundown/shared/profile.js';
import { track } from '@sundown/shared/telemetry.js';
import { seededShuffle, seedFor, dayNumber } from '@sundown/shared/seed.js';
import { showRoundPanel } from '@sundown/shared/roundpanel.js';
initTelemetry({ game: 'videopoker' });
import { createMachine, PAYTABLE } from './engine.js';
import { createCoach, markTutorialSeen } from '@sundown/shared/coach.js';
import { deck as freshDeck } from '@sundown/shared/cards.js';

const $ = (s) => document.querySelector(s);
const V3 = THREE.Vector3;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COIN = 5;                       // chips per coin in The Lounge (SPEC §3.2)

// ---------------------------------------------------------------- room + machine (SPEC §4)
const MZ = -0.55;                     // machine front plane
const L = createLounge({ stage: $('#stage'), room: ROOMS.lounge, lampAt: new V3(0.0, 2.05, MZ + 0.4), lampTarget: new V3(0, 1.0, MZ) });
const { scene, renderer, M } = L;
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1500);
const rig = createCameraRig(camera, { cinematic: { pos: new V3(0, 1.45, 0.92), look: new V3(0, 1.22, MZ - 0.1), fov: 50 } }, { reducedMotion });
const cab = new THREE.Group(); cab.position.set(0, 0, MZ); scene.add(cab);
const body = mat(0x3b2f2a), trim = M.brass, dark = mat(0x1d1a1c);
const add = (geo, m, x, y, z, parent = cab) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; };
add(new THREE.BoxGeometry(0.7, 0.92, 0.55), body, 0, 0.46, -0.1);                        // base
add(new THREE.BoxGeometry(0.72, 0.03, 0.58), trim, 0, 0.93, -0.1);
const deckTop = add(new THREE.BoxGeometry(0.7, 0.06, 0.24), body, 0, 0.97, 0.06);       // button deck
deckTop.rotation.x = 0.18;
add(new THREE.BoxGeometry(0.7, 0.62, 0.32), body, 0, 1.3, -0.24).rotation.x = -0.12;    // screen housing
add(new THREE.BoxGeometry(0.74, 0.2, 0.36), body, 0, 1.7, -0.27);                       // topper
add(new THREE.BoxGeometry(0.76, 0.02, 0.38), trim, 0, 1.6, -0.27);
add(new THREE.BoxGeometry(0.76, 0.02, 0.38), trim, 0, 1.8, -0.27);
// stool you sit on (mostly below frame) and a side table with a drink, for scale
const stool = add(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 12), M.rail, 0, 0.68, 0.95, scene); stool.castShadow = false;
add(new THREE.CylinderGeometry(0.03, 0.05, 0.66, 8), M.woodDark, 0, 0.33, 0.95, scene);
add(new THREE.CylinderGeometry(0.22, 0.22, 0.03, 14), M.wood, 0.62, 0.92, MZ + 0.25, scene);
add(new THREE.CylinderGeometry(0.04, 0.05, 0.9, 8), M.woodDark, 0.62, 0.45, MZ + 0.25, scene);
add(new THREE.CylinderGeometry(0.035, 0.03, 0.1, 10), mat(0xe6d3a8, { transparent: true, opacity: 0.85 }), 0.62, 0.985, MZ + 0.25, scene);

// screen: a canvas drawn by the game, shown unlit so it glows
const SW = 1280, SH = 960;
const screenCanvas = document.createElement('canvas'); screenCanvas.width = SW; screenCanvas.height = SH;
const screenTex = new THREE.CanvasTexture(screenCanvas); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.45), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
screen.position.set(0, 1.31, -0.075); screen.rotation.x = -0.12; cab.add(screen);
const screenGlow = new THREE.PointLight(0x9fb8c8, 0.6, 1.6, 2); screenGlow.position.set(0, 1.3, 0.15); cab.add(screenGlow);
// topper sign
{
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#2a211d'; g.fillRect(0, 0, 1024, 256);
  g.fillStyle = '#e8b860'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '400 92px "Young Serif", Georgia, serif'; g.fillText('Jacks or Better', 512, 110);
  g.font = '600 30px "Schibsted Grotesk", sans-serif'; g.fillStyle = '#d9cbb0'; g.fillText('SUNDOWN CLUB  ·  FULL PAY 9 / 6', 512, 196);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  cab.userData.signTex = t; cab.userData.drawSign = () => { const g2 = c.getContext('2d'); g2.fillStyle = '#2a211d'; g2.fillRect(0, 0, 1024, 256); g2.fillStyle = '#e8b860'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.font = '400 92px "Young Serif", Georgia, serif'; g2.fillText('Jacks or Better', 512, 110); g2.font = '600 30px "Schibsted Grotesk", sans-serif'; g2.fillStyle = '#d9cbb0'; g2.fillText('SUNDOWN CLUB  ·  FULL PAY 9 / 6', 512, 196); t.needsUpdate = true; };
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.175), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
  sign.position.set(0, 1.7, -0.088); cab.add(sign);
}
// buttons on the deck: five holds, bet, max, deal
const buttons = [];
const btnGroup = new THREE.Group(); btnGroup.position.set(0, 1.005, 0.07); btnGroup.rotation.x = 0.18; cab.add(btnGroup);
function makeButton(x, w, color, label) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.5, emissive: color, emissiveIntensity: 0.15 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.018, 0.05), m); b.position.set(x, 0.01, 0); b.castShadow = true; btnGroup.add(b);
  b.userData = { m, base: 0.01, label };
  buttons.push(b); return b;
}
const holdBtns = [-0.2, -0.1, 0, 0.1, 0.2].map((x, i) => makeButton(x, 0.075, 0xe6dccb, `hold${i}`));
const betBtn = makeButton(-0.29, 0.05, 0x86ad8f, 'bet');
const dealBtn = makeButton(0.3, 0.06, 0xe8b860, 'deal');
function press(b) { if (!b) return; b.position.y = b.userData.base - 0.006; setTimeout(() => (b.position.y = b.userData.base), 120); sfx.click(); }

// ---------------------------------------------------------------- state
const sfx = createSfx();
const machine = createMachine();
let bank = getChips().bankroll;
let coins = 5, lastWin = 0, message = 'Space to deal', winLine = null;
const faces = {}; let back = null;
const faceFor = (c) => (faces[c.rank + c.suit] ||= drawFace(c.rank, c.suit));
// per-card flip animation: 0 = back, 1 = face
const shownCards = [null, null, null, null, null];
const flip = [0, 0, 0, 0, 0], flipFrom = [0, 0, 0, 0, 0], flipStart = [0, 0, 0, 0, 0], flipTo = [0, 0, 0, 0, 0];
let animUntil = 0;
let settling = false, pending = null;   // a drawn hand waiting for payOut(), and its result
const stats = (() => { try { return JSON.parse(localStorage.getItem('vp.v1')) || {}; } catch { return {}; } })();
stats.hands ||= 0; stats.best ||= null; stats.bestCoins ||= 0; stats.won ||= 0;

// Today's hand: the same five cards (and draws) for everyone today, one go, free play (chips do not move).
const D = { on: false, prevCoins: 5, kind: 'daily', seed: 0, from: null };   // kind: 'daily' | 'challenge'; from: a friend's { n, v, l }
let lastSeeded = null;   // the last seeded hand finished here, for the share button
function save() {
  if (T.on || D.on) return;   // tutorial chips are pretend; today's hand is free play
  setBankroll(bank);
  try { localStorage.setItem('vp.v1', JSON.stringify(stats)); } catch { /* blocked */ }
  updateGame('videopoker', { resume: `Continue · ${fmt(bank)} chips`, facts: [[fmt(bank), 'Club chips'], [fmt(stats.hands), 'Hands'], [stats.best || '—', 'Best hand']], ledger: { hands: stats.hands, bestCoins: stats.bestCoins, won: stats.won } });
}

// ---------------------------------------------------------------- screen drawing (SPEC §4.3)
function drawScreen(now) {
  const g = screenCanvas.getContext('2d');
  g.fillStyle = '#16202b'; g.fillRect(0, 0, SW, SH);
  const grad = g.createLinearGradient(0, 0, 0, SH); grad.addColorStop(0, 'rgba(240,168,104,.10)'); grad.addColorStop(1, 'rgba(0,0,0,.25)'); g.fillStyle = grad; g.fillRect(0, 0, SW, SH);
  // pay table
  const x0 = 60, y0 = 40, rowH = 33, colW = 150, nameW = 380;
  g.fillStyle = 'rgba(232,184,96,.10)'; g.fillRect(x0 + nameW + (coins - 1) * colW - 6, y0 - 8, colW, rowH * PAYTABLE.length + 10);
  g.font = '600 26px "IBM Plex Mono", monospace'; g.textBaseline = 'top';
  PAYTABLE.forEach((l, r) => {
    const hit = winLine === l.name;
    g.fillStyle = hit ? '#f8e2a8' : '#d9cbb0'; g.textAlign = 'left'; g.font = `${hit ? 700 : 600} 26px "Schibsted Grotesk", sans-serif`;
    g.fillText(l.name.toUpperCase(), x0, y0 + r * rowH);
    g.font = '600 26px "IBM Plex Mono", monospace'; g.textAlign = 'right';
    l.pays.forEach((p, c) => { g.fillStyle = hit && c === coins - 1 ? '#ffffff' : c === coins - 1 ? '#f0d39a' : 'rgba(217,203,176,.55)'; g.fillText(String(p), x0 + nameW + c * colW + colW - 30, y0 + r * rowH); });
  });
  // cards
  const cw = 210, ch = 292, gap = 22, cx0 = (SW - (5 * cw + 4 * gap)) / 2, cy = 400;
  for (let i = 0; i < 5; i++) {
    const x = cx0 + i * (cw + gap);
    let f = flip[i];
    if (now < flipStart[i] + 260 && flipStart[i]) { const k = Math.min(1, Math.max(0, (now - flipStart[i]) / 260)); f = flipFrom[i] + (flipTo[i] - flipFrom[i]) * easeInOut(k); }
    const showFace = f > 0.5 && shownCards[i];
    const sx = Math.abs(Math.cos(f * Math.PI));
    g.save(); g.translate(x + cw / 2, cy + ch / 2); g.scale(Math.max(0.02, sx), 1);
    g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 18;
    g.drawImage(showFace ? faceFor(shownCards[i]) : back, -cw / 2, -ch / 2, cw, ch);
    g.restore();
    const held = machine.held[i] && machine.phase === 'dealt';
    g.font = '700 30px "Schibsted Grotesk", sans-serif'; g.textAlign = 'center';
    g.fillStyle = held ? '#f8e2a8' : 'rgba(217,203,176,.25)'; g.fillText(held ? 'HELD' : `${i + 1}`, x + cw / 2, cy + ch + 18);
  }
  // footer
  g.textAlign = 'left'; g.font = '600 30px "IBM Plex Mono", monospace'; g.fillStyle = '#d9cbb0';
  g.fillText(`CHIPS ${fmt(bank)}`, 60, SH - 70);
  g.textAlign = 'center'; g.fillStyle = winLine ? '#f8e2a8' : '#d9cbb0'; g.font = `${winLine ? 700 : 500} 32px "Schibsted Grotesk", sans-serif`;
  g.fillText(message, SW / 2, SH - 72);
  g.textAlign = 'right'; g.font = '600 30px "IBM Plex Mono", monospace'; g.fillStyle = '#d9cbb0';
  g.fillText(`BET ${coins} · ${coins * COIN} CHIPS`, SW - 60, SH - 70);
  screenTex.needsUpdate = true;
}

// ---------------------------------------------------------------- play (SPEC §3)
function hud() {
  $('#chips').textContent = fmt(bank); $('#lastWin').textContent = lastWin ? fmt(lastWin) : '—';
  $('#betN').textContent = coins;
  const dealt = machine.phase === 'dealt';
  $('#dealLbl').textContent = dealt ? 'Draw' : 'Deal';
  document.querySelectorAll('[data-hold]').forEach((b) => { b.disabled = !dealt; b.classList.toggle('on', dealt && machine.held[+b.dataset.hold]); });
  $('#bBet').disabled = dealt; $('#bMax').disabled = dealt;
  holdBtns.forEach((b, i) => { const on = dealt && machine.held[i]; b.userData.m.emissiveIntensity = on ? 0.9 : dealt ? 0.3 : 0.12; });
  dealBtn.userData.m.emissiveIntensity = 0.5 + (dealt ? 0.3 : 0);
}
function flipCard(i, to, delay) { const now = performance.now() + delay; flipStart[i] = now; flipFrom[i] = flip[i]; flipTo[i] = to; animUntil = Math.max(animUntil, now + 300); setTimeout(() => { flip[i] = to; if (to === 1) sfx.card(0.14); }, delay + 140); }
function deal() {
  if (machine.phase === 'dealt' || performance.now() < animUntil) return;
  if (!tutAllows('deal')) return;
  const cost = coins * COIN;
  if (!D.on && bank < cost) {
    if (canRefill()) { bank = refill().bankroll; toast('The club topped your chips back up to 1,000.'); }
    else { coins = Math.max(1, Math.floor(bank / COIN)); if (bank < COIN) return toast('Not enough chips for a coin.'); }
  }
  if (!D.on) bank -= coins * COIN;
  save(); sfx.chip(); press(dealBtn);
  winLine = null; lastWin = 0;
  const { hand } = machine.deal(coins, T.on ? { deck: lessonDeck() } : D.on ? { deck: seededShuffle(freshDeck(), D.seed) } : undefined);
  for (let i = 0; i < 5; i++) { flip[i] = 0; flipCard(i, 0, 0); }
  setTimeout(() => { hand.forEach((c, i) => { shownCards[i] = c; flipCard(i, 1, i * 90); }); }, 160);
  message = 'Hold with 1–5, then draw';
  hud();
  tutEmit('dealt');
}
function draw() {
  if (machine.phase !== 'dealt' || performance.now() < animUntil) return;
  if (!tutAllows('draw')) return;
  press(dealBtn);
  const { hand, replaced, result } = machine.draw();
  let d = 0;
  for (const i of replaced) { flipCard(i, 0, d); setTimeout(((j) => () => { shownCards[j] = hand[j]; flipCard(j, 1, 0); })(i), d + 280); d += 120; }
  settling = true; pending = result;
  setTimeout(() => payOut(result), d + 420);
  hud();
}
// Pays a drawn hand once: after the flips, or at once if the player starts the
// tutorial or leaves before they finish (so a result is never lost).
function payOut(result) {
  if (!settling) return;
  settling = false; pending = null;
  if (D.on) return finishDaily(result);
  const real = !T.on;
  stats.hands += 1;
  if (result) {
    const won = result.coins * COIN; bank += won; lastWin = won; winLine = result.name; stats.won += won;
    message = `${result.name} · +${fmt(won)}`;
    sfx.sting(result.coins / coins >= 25 ? 'big' : 'win');
    if (result.coins > stats.bestCoins) { stats.bestCoins = result.coins; stats.best = result.name; }
    rig.beat(new V3(0, 1.3, MZ), 0.06, -1.5, 500, 700, 900);
  } else { message = 'No win this time'; lastWin = 0; }
  save(); hud();
  tutEmit('result');
  if (real) showRoundPanel(reportRound('videopoker', 'hand', { hand: result ? result.name : 'none', rank: result ? RANK[result.name] : 0, win: !!result, won: result ? result.coins * COIN : 0, bet: coins }), { corner: 'bl' });
}
function finishDaily(result) {
  const name = result ? result.name : 'No win', won = result ? result.coins : 0;
  const held = machine.held.slice();
  const kind = D.kind, from = D.from, seed = D.seed;
  D.on = false; coins = D.prevCoins; D.from = null;
  let tail = '';
  if (kind === 'daily') {
    const r = reportSeed('videopoker', { name, coins: won });
    const shown = r.result || { name, coins: won };
    lastSeeded = { kind, seed, name: shown.name, coins: shown.coins, held, day: dayNumber() };
    tail = ` · ${shown.name}${shown.coins ? ` · ${shown.coins} coins` : ''}${r.first ? ` · +${r.xp} XP` : ''}`;
  } else {
    lastSeeded = { kind, seed, name, coins: won, held, from };
    if (from) tail = won > from.v ? ` · you beat ${from.n} (${from.v})` : won === from.v ? ` · level with ${from.n} (${from.v})` : ` · ${from.n} had ${from.v}`;
    track('challenge_accepted');
  }
  winLine = result ? result.name : null; lastWin = 0;
  message = kind === 'daily' ? `Today's hand${tail}` : `Challenge: ${name}${won ? ` · ${won} coins` : ''}${tail}`;
  if (result) sfx.sting(result.coins >= 25 ? 'big' : 'win');
  showRoundPanel(reportRound('videopoker', 'hand', { hand: name, rank: result ? RANK[result.name] : 0, win: !!result, won: 0, bet: 5 }), { corner: 'bl' });
  $('#bShare').hidden = false;
  hud(); dailyBtn();
}
async function shareHand() {
  if (!lastSeeded) return;
  const L = lastSeeded, btn = $('#bShare');
  btn.disabled = true;
  try {
    const p = readProfile(), lvl = levelFor(p.xp);
    const grid = L.held.map((h) => (h ? '🟩' : '⬛')).join('');
    const label = L.name === 'No win' ? 'No win' : L.name;
    const c = await makeChallenge({ g: 'videopoker', s: L.seed, v: L.coins, l: label.slice(0, 24) });
    const url = c?.code ? `${location.origin}/c/${c.code}` : null;
    const eyebrow = L.kind === 'daily' ? `Sundown Daily #${L.day}` : 'Challenge hand';
    const png = await renderShareCard({ eyebrow, title: label, sub: L.coins ? `${L.coins} coins` : 'Better luck next hand', game: 'Video Poker · Jacks or Better', accent: '#e8b860', foot: `Level ${lvl.level} · ${titleFor(lvl.level)}${p.streak?.days > 1 ? ` · ${p.streak.days}-day streak` : ''}`, grid });
    const text = `${eyebrow} · Video Poker\n${label}${L.coins ? ` (${L.coins} coins)` : ''}\n${grid}${url ? '\nCan you beat it?' : ''}`;
    const how = await shareResult({ title: eyebrow, text, url, png });
    track('share_click', { kind: how });
    if (c?.code && L.kind === 'daily') track('challenge_sent');
    toast(how === 'copied' ? (url ? 'Link and result copied.' : 'Result copied.') : how === 'downloaded' ? 'Picture saved.' : how === 'shared' ? 'Shared.' : 'Could not share that.');
    if (!url) toast(c?.error === 'boards off' ? 'Turn on the club boards to make a challenge link.' : 'Result copied. Challenge links are not set up yet.');
  } finally { btn.disabled = false; }
}
async function startChallenge(code) {
  if (T.on || D.on || settling || machine.phase === 'dealt' || performance.now() < animUntil) return;
  const r = await checkChallenge(code);
  if (!r?.ok || r.data.g !== 'videopoker') { toast('That challenge link is not valid.'); return; }
  D.on = true; D.kind = 'challenge'; D.seed = r.data.s; D.from = { n: r.data.n || 'A friend', v: r.data.v, l: r.data.l }; D.prevCoins = coins; coins = 5;
  $('#bShare').hidden = true; hud(); deal();
  message = `${D.from.n} got ${r.data.l}${r.data.v ? ` (${r.data.v} coins)` : ''}. Hold with 1–5, then draw`;
}
function startDaily() {
  if (T.on || D.on || settling || machine.phase === 'dealt' || performance.now() < animUntil) return;
  const done = seedResults().videopoker;
  if (done) { toast(`Today's hand: ${done.name}${done.coins ? ` · ${done.coins} coins` : ''}. A new hand comes at midnight UTC.`); return; }
  D.on = true; D.kind = 'daily'; D.seed = seedFor('videopoker'); D.from = null; D.prevCoins = coins; coins = 5; $('#bShare').hidden = true; hud(); deal();
  message = "Today's hand · hold with 1–5, then draw";
}
function dailyBtn() {
  const done = seedResults().videopoker;
  $('#bDaily').firstChild.textContent = done ? `Today's hand: ${done.name} ` : `Today's hand #${dayNumber()} `;
}
const RANK = { 'Jacks or better': 1, 'Two pair': 2, 'Three of a kind': 3, 'Straight': 4, 'Flush': 5, 'Full house': 6, 'Four of a kind': 7, 'Straight flush': 8, 'Royal flush': 9 };
function toggle(i) { if (machine.phase !== 'dealt' || performance.now() < animUntil) return; if (!tutAllows(`hold${i}`)) return; machine.toggle(i); press(holdBtns[i]); hud(); if (T.on && machine.held[1] && machine.held[3]) tutEmit('held'); }
function betOne() { if (machine.phase === 'dealt' || !tutAllows('bet')) return; coins = coins % 5 + 1; press(betBtn); sfx.chip(); hud(); message = `Bet ${coins} · Space to deal`; }
function maxBet() { if (machine.phase === 'dealt' || !tutAllows('deal')) return; coins = 5; hud(); deal(); }
let toastTimer;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2400); }

// Enter and Space on a keyboard-focused button, or anywhere in the tutorial or
// leave card, press that button: they must not deal a hand behind it.
const keyForControl = (e) => (e.key === ' ' || e.key === 'Enter') && !!(e.target.closest?.('.sc-coach, .sc-leave') || e.target.matches?.('button:focus-visible'));
addEventListener('keydown', (e) => {
  if (keyForControl(e)) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { e.preventDefault(); machine.phase === 'dealt' ? draw() : deal(); }
  else if (k >= '1' && k <= '5') toggle(+k - 1);
  else if (k === 'b') betOne();
  else if (k === 'm') maxBet();
  else if (k === 't' && !T.on && !D.on) startTutorial();
  else if (k === 'd') startDaily();
  else if (k === 's' && lastSeeded && !D.on) shareHand();
});
$('#bLearn').addEventListener('click', () => (T.on || D.on ? null : startTutorial()));
$('#bDaily').addEventListener('click', startDaily);
$('#bShare').addEventListener('click', shareHand);
$('#bDeal').addEventListener('click', () => (machine.phase === 'dealt' ? draw() : deal()));
$('#bBet').addEventListener('click', betOne);
$('#bMax').addEventListener('click', maxBet);
document.querySelectorAll('[data-hold]').forEach((b) => b.addEventListener('click', () => toggle(+b.dataset.hold)));
// click the cards on the screen to hold them
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([screen, ...buttons], false)[0]; if (!hit) return;
  if (hit.object === screen) { const u = hit.uv.x * SW, v = (1 - hit.uv.y) * SH; if (v > 380 && v < 740) { const i = Math.floor((u - (SW - (5 * 210 + 4 * 22)) / 2) / 232); if (i >= 0 && i < 5) toggle(i); } return; }
  const lbl = hit.object.userData.label;
  if (lbl === 'deal') machine.phase === 'dealt' ? draw() : deal(); else if (lbl === 'bet') betOne(); else if (lbl?.startsWith('hold')) toggle(+lbl.slice(4));
});


// ---------------------------------------------------------------- tutorial (plain English, one set-up hand)
const T = { on: false, i: 0, allow: new Set(), steps: [], bank: 0 };
const coach = createCoach({ game: 'Video Poker', onSkip: () => endTutorial() });
const cc = (rank, suit) => ({ rank, suit });
const LESSON = [cc('4', 'D'), cc('J', 'S'), cc('9', 'C'), cc('J', 'H'), cc('2', 'S'), cc('J', 'D'), cc('7', 'C'), cc('K', 'H')];
function lessonDeck() { const used = new Set(LESSON.map((x) => x.rank + x.suit)); return [...LESSON, ...freshDeck().filter((x) => !used.has(x.rank + x.suit))]; }
function tutAllows(a) { if (!T.on || T.allow.has(a)) return true; coach.nudge(); return false; }
function tutEmit(ev) { if (T.on && T.steps[T.i]?.until === ev) setTimeout(() => goStep(T.i + 1), ev === 'result' ? 700 : 250); }
function goStep(i) {
  T.i = i; const st = T.steps[i]; if (!st) return endTutorial();
  T.allow = new Set(st.allow || []);
  const next = st.until ? [] : [{ label: st.nextLabel || 'Next', primary: true, onClick: () => goStep(i + 1) }];
  coach.show({ label: `Video poker tutorial · ${i + 1} of ${T.steps.length}`, title: st.title, body: st.body, list: st.list, todo: st.todo, pulse: st.pulse, buttons: st.buttons || next });
}
T.steps = [
  { title: 'Video poker in one minute', body: ['You get five cards. You pick which ones to keep, then swap all the others, once.', 'Your final five cards are checked against the list at the top of the screen. If they make one of those hands, you win.', 'The smallest win is a pair of Jacks or better: two Jacks, two Queens, two Kings or two Aces.'], nextLabel: 'Got it' },
  { title: 'Deal five cards', body: ['These are practice chips, so nothing real is at risk.'], todo: 'Press Deal, or the Space bar.', pulse: ['#bDeal'], allow: ['deal'], until: 'dealt' },
  { title: 'Keep the pair', body: ['You have two Jacks, the second and fourth cards. A pair of Jacks already wins, so keep both.', 'Keeping a card is called holding it. HELD appears under every card you hold.'], todo: 'Press 2 and then 4.', pulse: ['[data-hold="1"]', '[data-hold="3"]'], allow: ['hold1', 'hold3'], until: 'held' },
  { title: 'Swap the rest', body: ['Every card you did not hold is swapped for a new one.'], todo: 'Press Draw, or the Space bar.', pulse: ['#bDeal'], allow: ['draw'], until: 'result' },
  { title: 'Three Jacks!', body: ['A third Jack came. Three of a kind pays 3 coins for every coin you bet. You bet 5 coins, so you won 15 coins, which is 75 chips.'] },
  { title: 'You know how to play video poker', body: ['The practice chips go away now. When you play for real, you use your club chips.'],
    list: [['Hold', 'keep a card when you draw'], ['Draw', 'swap every card you did not hold, once'], ['Bet', '1 to 5 coins. With 5 coins the top prize, a royal flush, pays far more.']],
    buttons: [{ label: 'Play for real', primary: true, onClick: () => endTutorial() }, { label: 'Do it again', onClick: () => startTutorial() }] },
];
function startTutorial() {
  // A real hand still being paid out is paid now, so its result is kept.
  if (settling) payOut(pending);
  if (machine.phase === 'dealt') {
    if (T.on) machine.draw();   // a practice hand: nothing to keep
    else { const { result } = machine.draw(); if (result) bank += result.coins * COIN; stats.hands += 1; save(); }   // a real hand is drawn for you, like leaving
  }
  if (!T.on) T.bank = bank;
  T.on = true; markTutorialSeen('videopoker');
  bank = 1000; coins = 5; winLine = null; lastWin = 0; message = 'Tutorial · practice chips';
  for (let i = 0; i < 5; i++) { shownCards[i] = null; flip[i] = 0; }
  hud(); goStep(0);
}
function endTutorial() {
  coach.hide();
  if (!T.on) return;
  if (machine.phase === 'dealt') machine.draw();
  T.on = false; T.allow.clear();
  bank = getChips().bankroll; winLine = null; lastWin = 0; message = 'Space to deal';
  for (let i = 0; i < 5; i++) { shownCards[i] = null; flip[i] = 0; }
  hud();
}

// ---------------------------------------------------------------- leaving
const playtime = trackPlaytime('videopoker');
createLeaveGuard({ game: 'Video Poker', save: () => {
  // a hand left mid-draw is drawn for you, so the bet is never lost to leaving
  if (D.on && machine.phase === 'dealt') { machine.draw(); D.on = false; coins = D.prevCoins; }   // today's hand left unfinished: not counted, nothing paid
  else if (T.on) { T.on = false; bank = getChips().bankroll; }
  else if (settling) payOut(pending);
  else if (machine.phase === 'dealt') { const { result } = machine.draw(); if (result) bank += result.coins * COIN; }
  playtime.flush(); save();
} });
addEventListener('pagehide', save);

// ---------------------------------------------------------------- loop
let last = performance.now(), elapsed = 0;
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;
  rig.update(dt, elapsed);
  drawScreen(now);
  screenGlow.intensity = 0.5 + Math.sin(elapsed * 2) * 0.03;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
async function boot() {
  try { await Promise.race([Promise.all(['700 72px "Schibsted Grotesk"', '600 30px "IBM Plex Mono"', '400 92px "Young Serif"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch { /* fonts optional */ }
  back = drawBack(); cab.userData.drawSign();
  L.resize(camera); addEventListener('resize', () => L.resize(camera));
  L.applyDay(0.755);
  hud(); dailyBtn(); frame();
  $('#loading').classList.add('gone');
  const wantDaily = /[?&]daily\b/.test(location.search);   // the hub's "Play today's hand" link
  const challenge = new URLSearchParams(location.search).get('c');   // /c/<code> sends people here with ?c=<code>
  if (challenge) setTimeout(() => startChallenge(challenge), 600);
  else if (wantDaily) setTimeout(startDaily, 600);
  else if (!stats.hands) coach.offerOnce('videopoker', { title: 'New to video poker?', body: ['A one-minute tutorial plays a practice hand with you and explains each step in plain words.'], onYes: () => startTutorial() });
  window.__vp = { T, D, startDaily, startChallenge, shareHand, startTutorial, machine, deal, draw, toggle, get bank() { return bank; } };
}
boot();
