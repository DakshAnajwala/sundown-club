import * as THREE from 'three';
import { createLounge, createCameraRig, ROOMS, mat } from '@sundown/shared/lounge/lounge.js';

const $ = (s) => document.querySelector(s);
const V3 = THREE.Vector3;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- room + table (SPEC §4)
const FELT_Y = 0.76, A = 1.15, B = 0.62;                       // felt ellipse semi-axes (x, z)
const L = createLounge({ stage: $('#stage'), room: ROOMS.lounge, lampAt: new V3(0, 1.95, 0), lampTarget: new V3(0, FELT_Y, 0) });
const { scene, renderer } = L;
const camera = new THREE.PerspectiveCamera(56, 1, 0.05, 1500);
const rig = createCameraRig(camera, {
  cinematic: { pos: new V3(0, 1.62, 1.86), look: new V3(0, 0.82, -0.22), fov: 58 },
  fixed: { pos: new V3(0, 2.25, 1.55), look: new V3(0, 0.72, -0.05), fov: 56 },
}, { reducedMotion });
const ellipse = (scale = 1) => { const s = new THREE.Shape(); for (let i = 0; i <= 96; i++) { const t = (i / 96) * Math.PI * 2, x = Math.cos(t) * A * scale, y = Math.sin(t) * B * scale; i ? s.lineTo(x, y) : s.moveTo(x, y); } return s; };
const feltCanvas = document.createElement('canvas'); feltCanvas.width = 2048; feltCanvas.height = Math.round(2048 * B / A);
const feltTex = new THREE.CanvasTexture(feltCanvas); feltTex.colorSpace = THREE.SRGBColorSpace; feltTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
feltTex.repeat.set(1 / (2 * A), 1 / (2 * B)); feltTex.offset.set(0.5, 0.5);
{
  const top = new THREE.Mesh(new THREE.ExtrudeGeometry(ellipse(), { depth: 0.05, bevelEnabled: false, curveSegments: 96 }), [new THREE.MeshStandardMaterial({ map: feltTex, roughness: 1 }), L.M.wood]);
  top.geometry.rotateX(-Math.PI / 2); top.position.y = FELT_Y - 0.05; top.receiveShadow = true; top.castShadow = true; scene.add(top);
  const apron = new THREE.Mesh(new THREE.ExtrudeGeometry(ellipse(0.97), { depth: 0.12, bevelEnabled: false, curveSegments: 48 }), L.M.woodDark);
  apron.geometry.rotateX(-Math.PI / 2); apron.position.y = FELT_Y - 0.17; apron.castShadow = true; scene.add(apron);
  const pts = []; for (let i = 0; i < 96; i++) { const t = (i / 96) * Math.PI * 2; pts.push(new V3(Math.cos(t) * (A + 0.035), FELT_Y + 0.012, Math.sin(t) * (B + 0.035))); }
  const rail = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 192, 0.05, 7, true), L.M.rail); rail.castShadow = true; rail.receiveShadow = true; scene.add(rail);
  for (const x of [-0.55, 0.55]) { const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.6, 8), L.M.woodDark); ped.position.set(x, 0.3, 0); scene.add(ped); const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.33, 0.04, 10), L.M.woodDark); foot.position.set(x, 0.02, 0); foot.receiveShadow = true; scene.add(foot); }
}
function drawFelt() {
  const g = feltCanvas.getContext('2d'), Wf = feltCanvas.width, Hf = feltCanvas.height, px = Wf / (2 * A);
  const X = (x) => (x + A) * px, Z = (z) => (z + B) * px;
  g.fillStyle = feltColor('#4f7f73'); g.fillRect(0, 0, Wf, Hf);
  const vg = g.createRadialGradient(Wf / 2, Hf / 2, 80, Wf / 2, Hf / 2, Wf * 0.6); vg.addColorStop(0, 'rgba(255,255,255,.06)'); vg.addColorStop(1, 'rgba(0,0,0,.2)'); g.fillStyle = vg; g.fillRect(0, 0, Wf, Hf);
  const ink = 'rgba(233,225,207,0.78)'; g.strokeStyle = ink; g.fillStyle = ink;
  g.lineWidth = 3; g.beginPath(); g.ellipse(Wf / 2, Hf / 2, (A - 0.2) * px, (B - 0.2) * px, 0, 0, 7); g.stroke();
  g.lineWidth = 2; for (let i = 0; i < 5; i++) { g.beginPath(); g.roundRect(X(BOARD_X[i] - 0.052), Z(BOARD_Z - 0.071), 0.104 * px, 0.142 * px, 10); g.stroke(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `400 54px "Young Serif", Georgia, serif`; g.fillText('sundown club', Wf / 2, Z(BOARD_Z + 0.17));
  g.font = `600 22px "Schibsted Grotesk", system-ui, sans-serif`;
  g.fillText("NO-LIMIT HOLD'EM  ·  BLINDS 5 / 10", Wf / 2, Z(BOARD_Z + 0.24));
  feltTex.needsUpdate = true;
}

// ---------------------------------------------------------------- seats (SPEC §4.2)
// Seven even slots around the table: you at 90° (nearest the camera), the dealer across,
// five regulars in between. Angles grow clockwise seen from above, which is the order of play.
const BOARD_X = [-0.24, -0.12, 0, 0.12, 0.24], BOARD_Z = -0.06;
const SEAT_DEG = [90, 141.43, 192.86, 244.29, 347.14, 38.57], DEALER_DEG = 295.71;
const onRim = (deg, out) => { const t = THREE.MathUtils.degToRad(deg); return new V3(Math.cos(t) * (A + out), 0, Math.sin(t) * (B + out)); };
const toward = (p, d) => p.clone().multiplyScalar(1 - d / p.length());
const REGULARS = [
  { name: 'Marlow', style: 'shark', suit: SUITS.charcoal },
  { name: 'Ilse', style: 'rock', suit: SUITS.navy },
  { name: 'Teodor', style: 'maniac', suit: SUITS.olive },
  { name: 'Juno', style: 'station', suit: SUITS.cream },
  { name: 'Vance', style: 'pro', suit: SUITS.burgundy },

const seats = SEAT_DEG.map((deg, i) => {
  const rim = onRim(deg, 0);
  return {
    deg,
    hole: toward(rim, i === 0 ? 0.24 : 0.2).setY(FELT_Y + 0.0015),
    bet: toward(rim, i === 0 ? 0.38 : 0.34).setY(FELT_Y),

    button: toward(rim, 0.3).setY(FELT_Y + 0.004).add(new V3(Math.cos(THREE.MathUtils.degToRad(deg - 90)) * 0.14, 0, Math.sin(THREE.MathUtils.degToRad(deg - 90)) * 0.14)),
  };
});
const figures = REGULARS.map((r, k) => {
  const deg = SEAT_DEG[k + 1];
  return createFigure(scene, { at: onRim(deg, 0.47), face: new V3(0, 0, 0), seated: true, colors: r.suit, reducedMotion, restReach: 0.52 });
});
const dealer = createFigure(scene, { at: onRim(DEALER_DEG, 0.3), face: new V3(0, 0, 0), seated: false, colors: SUITS.charcoal, scale: 0.93, reducedMotion, restReach: 0.38 });
const DEALER_HAND = onRim(DEALER_DEG, -0.12).setY(FELT_Y + 0.05);
const POT_AT = new V3(0.2, FELT_Y, 0.15);
const MUCK = onRim(DEALER_DEG, -0.3).setY(FELT_Y + 0.002);

const cards = createCardKit(renderer, scene);
const chipKit = createChipKit(scene);
const sfx = createSfx();
const betStacks = seats.map((s) => { const k = chipKit.stack(); k.group.position.copy(s.bet); return k; });
const seatStacks = seats.map((s) => { const k = chipKit.stack({ maxPerColumn: 14 }); k.group.position.copy(s.stack); return k; });
const potStack = chipKit.stack({ maxPerColumn: 16 }); potStack.group.position.copy(POT_AT);
const button = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.008, 24), [mat(0xf3ede2), (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#f3ede2'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#2e2d35'; g.font = '700 72px "Schibsted Grotesk", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('D', 64, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }); })(), mat(0xf3ede2)]);
button.castShadow = true; scene.add(button);

// ---------------------------------------------------------------- table state
const TL = createTimeline();
const BUY_IN = 500, BIG = 10;
let club = getChips();
let me = Math.min(BUY_IN, club.bankroll);
if (me < BIG * 2) { club = refill(); me = Math.min(BUY_IN, club.bankroll); }
let offTable = club.bankroll - me;
const table = createHoldem({
  seats: [{ name: 'You', stack: me, human: true }, ...REGULARS.map((r, i) => ({ name: r.name, stack: 400 + ((i * 173) % 5) * 120, style: r.style }))],
  sb: 5, bb: BIG,
});
const P = table.players;
const T = { on: false, i: 0, allow: new Set(), steps: [], saved: [] };   // tutorial state (below)
const statsKey = 'holdem.v1';
const stats = (() => { try { return JSON.parse(localStorage.getItem(statsKey)) || {}; } catch { return {}; } })();
stats.hands ||= 0; stats.won ||= 0; stats.biggest ||= 0;
const realStack = () => (T.on ? T.saved[0] : P[0].stack);
function saveGame() {
  const mine = realStack();
  setBankroll(offTable + mine);
  try { localStorage.setItem(statsKey, JSON.stringify(stats)); } catch { /* blocked */ }
  updateGame('holdem', { resume: `Continue · ${fmt(offTable + mine)} chips`, facts: [[fmt(offTable + mine), 'Club chips'], [fmt(stats.won), 'Hands won'], [fmt(stats.biggest), 'Biggest pot']], ledger: { hands: stats.hands, won: stats.won, biggest: stats.biggest } });
}

// ---------------------------------------------------------------- animation of engine events (SPEC §6)
const fly = (mesh, from, to, dur, { arc = 0.06, flipTo = null, flipFrom = Math.PI, yaw = 0 } = {}) => {
  TL.add(dur, {
    start() { mesh.visible = true; sfx.card(); },
    update(k) { const e = easeInOut(k); mesh.position.lerpVectors(from, to, e); mesh.position.y += Math.sin(Math.PI * e) * arc; mesh.rotation.y = yaw * e; if (flipTo != null) cards.setFlip(mesh, flipFrom + (flipTo - flipFrom) * easeInOut(Math.max(0, (k - 0.5) / 0.5))); },
  }, dur * 0.45);
};
// Start a step at the current moment, beside whatever is already queued.
// TL.add() called from inside a TL.call() queues after everything already
// scheduled, so pot and payout slides used to land after handOver() had set
// the real stacks, and the winner's stack was counted twice.
function addNow(dur, fns) {
  const it = { t0: TL.clock, dur, ...fns, started: false };
  const at = TL.items.findIndex((x) => x.t0 > it.t0);
  TL.items.splice(at < 0 ? TL.items.length : at, 0, it);
  return it;
}
function slideChips(fromIdx, toPos, amount, after, now = false) {
  const k = chipKit.stack(); k.set(amount);
  const from = fromIdx === 'pot' ? POT_AT.clone() : seats[fromIdx].bet.clone();
  const step = { start() { sfx.chip(); }, update(e) { k.group.position.lerpVectors(from, toPos, easeInOut(e)); k.group.position.y += Math.sin(Math.PI * e) * 0.03; }, end() { scene.remove(k.group); after?.(); refreshHud(); } };
  if (now) addNow(380, step); else TL.add(380, step);
}
function sayFor(e) {
  switch (e.action) {
    case 'fold': return 'Fold'; case 'check': return 'Check'; case 'call': return `Call ${fmt(e.amount)}`;
    case 'bet': return `Bet ${fmt(e.to)}`; case 'raise': return `Raise to ${fmt(e.to)}`; default: return `All-in ${fmt(e.to)}`;
  }
}
function animate(ev) {

    const i = e.seat;

      e.cards.forEach((c, n) => {
        const m = cards.make(c, DEALER_HAND); m.visible = false; holeMeshes[i].push(m);
        const at = seats[i].hole.clone().add(new V3((n - 0.5) * (i === 0 ? 0.105 : 0.05), n * 0.0008, 0));
        const yaw = Math.atan2(-seats[i].hole.x, -seats[i].hole.z) + Math.PI;
        TL.call(() => dealer.reach('right', DEALER_HAND.clone().add(new V3(0, 0.02, 0))));
        fly(m, DEALER_HAND, at, 300, { flipTo: i === 0 ? 0 : null, yaw: i === 0 ? 0 : yaw });
      });
      TL.call(() => dealer.rest());
    } else if (e.type === 'act') {
      TL.call(() => {
        shown.turn = -1; shown.say[i] = sayFor(e);
        if (e.action === 'fold') {
          shown.folded[i] = true;
          for (const m of holeMeshes[i]) { const from = m.position.clone(); TL.add(320, { update(k) { m.position.lerpVectors(from, MUCK, easeInOut(k)); m.position.y += Math.sin(Math.PI * k) * 0.03; }, end() { scene.remove(m); } }, 0); }

          if (i > 0) { const f = figures[i - 1]; f.reach('right', seats[i].bet.clone().add(new V3(0, 0.03, 0))); setTimeout(() => f.rest('right'), 700 / TL.speed); }
        }
        if (e.action === 'check' && i > 0) { const f = figures[i - 1]; f.reach('left', seats[i].hole.clone().add(new V3(0, 0.02, 0))); setTimeout(() => f.rest('left'), 450 / TL.speed); sfx.click(); }

    }
  }
}

// ---------------------------------------------------------------- flow (SPEC §3.4)
function nextStep() {
  const S = table.state;
  if (S.street === 'done' || S.street === 'idle') return;
  const seat = S.toAct;
  if (seat === 0) { TL.call(showActions); return; }
  TL.call(() => { shown.turn = seat; refreshHud(); });
  TL.wait(450 + ((seat * 211 + S.hand * 97) % 650));
  TL.call(() => { const ev = table.act(seat, T.on ? scripted(seat) : decide(table, seat)); animate(ev); nextStep(); });
}
function newHand(startOpts) {
  for (const m of [...holeMeshes.flat(), ...boardMeshes]) scene.remove(m);
  holeMeshes = P.map(() => []); boardMeshes = []; myPot = 0; sawShowdown = false;
  won.amount = P.map(() => 0); won.desc = P.map(() => null);
  P.forEach((p, i) => { if (i > 0 && p.stack <= 0) { p.stack = 500; shown.stack[i] = 500; shown.say[i] = 'Rebuys'; } });
  if (P[0].stack <= 0) return askRebuy();
  shown.folded = P.map((p) => p.stack <= 0); shown.won = P.map(() => false); shown.say = P.map((_, i) => (shown.say[i] === 'Rebuys' ? 'Rebuys' : ''));
  shown.pot = 0; shown.bet = P.map(() => 0); shown.stack = P.map((p) => p.stack);
  refreshHud(); hint('');
  const ev = table.startHand(startOpts);

  TL.call(() => hint(`<b>${myHandText()}</b>`));

}
// One line for you at the end of every hand: who took the pot, and with what.
function handResult(myWin) {
  if (myWin) return `<b>Your pot: ${fmt(myPot)}.</b>`;
  const winners = P.map((p, s) => s).filter((s) => won.amount[s] > 0);
  if (!winners.length) return '';
  const names = winners.map((s) => P[s].name).join(' and ');
  const total = winners.reduce((n, s) => n + won.amount[s], 0);
  const desc = won.desc[winners[0]];
  const mine = !shown.folded[0] && table.state.board.length >= 3 ? myHandText() : '';
  return `<b>${names} ${winners.length > 1 ? 'split' : 'wins'} ${fmt(total)}</b>${desc ? ' · ' + desc : ''}${mine ? ' · you had ' + mine : ''}.`;
}
function handOver() {
  if (T.on) { shown.stack = P.map((p) => p.stack); refreshHud(); hint(''); tutEmit('handEnd'); return; }
  stats.hands += 1;
  const myWin = shown.won[0];
  if (myWin) { stats.won += 1; }
  stats.biggest = Math.max(stats.biggest, myPot);
  shown.stack = P.map((p) => p.stack); refreshHud();
  saveGame();
  {
    let cat = 0;
    try { if (myWin && sawShowdown) cat = categoryOf(best([...P[0].hole, ...table.state.board]).score); } catch { /* keep 0 */ }
    showRoundPanel(reportRound('holdem', 'hand', { won: !!myWin, pot: myPot, showdown: sawShowdown, cat, folded: !!shown.folded[0] }), { corner: 'bl' });
  }
  hint(`${handResult(myWin)} Next hand in a moment · <kbd>Space</kbd> deals now`);

}

  { title: "You know how to play Hold'em", body: ['Here are the words you just learned. The practice chips go away now; at the real table you play with your club chips.'],
    list: [['Fold', 'give up this hand. Chips you already put in stay in the pot.'], ['Check', 'pass, when nobody has bet yet. It costs nothing.'], ['Call', 'put in the same as the biggest bet so far.'], ['Bet or Raise', 'put in more, so others must match it or give up.'], ['All-in', 'bet every chip you have at the table.'], ['Pot', 'all the chips in the middle. The winner takes it.']],
    buttons: [{ label: 'Play for real', primary: true, onClick: () => endTutorial() }, { label: 'Do it again', onClick: () => { softReset(); startTutorial(true); } }] },
];
function softReset() {
  TL.items.length = 0; TL.cursor = TL.clock;
  for (const m of [...holeMeshes.flat(), ...boardMeshes]) scene.remove(m);
  holeMeshes = P.map(() => []); boardMeshes = [];
  for (const p of P) { p.bet = 0; p.total = 0; p.hole = []; p.folded = false; p.allIn = false; p.acted = false; }
  table.state.street = 'idle'; table.state.toAct = -1; table.state.board = [];
  $('#actions').hidden = true; $('#rebuy').hidden = true; legal = null;
  shown.pot = 0; shown.bet = P.map(() => 0); shown.say = P.map(() => ''); shown.folded = P.map(() => false); shown.won = P.map(() => false); shown.turn = -1;
  shown.stack = P.map((p) => p.stack);
  figures.forEach((f) => f.rest()); dealer.rest();
  refreshHud(); hint('');
}
function startTutorial(again = false) {
  if (!again) {
    // a hand in progress is called off: everyone gets back what they put in
    T.saved = P.map((p) => p.stack + (table.state.street === 'done' || table.state.street === 'idle' ? 0 : p.total));
    T.button = table.state.button;
  }
  T.on = true; markTutorialSeen('holdem');
  softReset();
  for (const p of P) p.stack = 500;
  shown.stack = P.map((p) => p.stack); refreshHud();
  goStep(0);
}
function tutHand() { script = JSON.parse(JSON.stringify(SCRIPT_START)); newHand({ deck: lessonDeck(), button: 0 }); }
function endTutorial() {
  coach.hide();
  if (!T.on) return;
  softReset();
  P.forEach((p, i) => { p.stack = T.saved[i]; });
  table.state.button = T.button;
  T.on = false; T.allow.clear();
  shown.stack = P.map((p) => p.stack); refreshHud();
  saveGame();
  hint('Press T any time to see the tutorial again.');
  setTimeout(() => newHand(), 600);
}

// ---------------------------------------------------------------- leaving (Esc twice) and saving
const playtime = trackPlaytime('holdem');
createLeaveGuard({ game: "Hold'em", save: () => { playtime.flush(); saveGame(); } });
addEventListener('pagehide', saveGame);

// ---------------------------------------------------------------- loop
let last = performance.now(), elapsed = 0;
// labels sit on the rail in front of each regular, so they never collide with the HUD
const tagAt = P.map((_, i) => (i === 0 ? null : onRim(SEAT_DEG[i], 0.02).setY(FELT_Y + 0.17)));
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;
  TL.tick(dt * 1000);
  for (const f of figures) f.update(dt, elapsed, TL.speed);
  dealer.update(dt, elapsed, TL.speed);
  rig.update(dt, elapsed, TL.speed);
  tags.forEach((t, i) => t && place(t, tagAt[i]));
  place($('#potTag'), POT_AT.clone().add(new V3(0, 0.0, 0.1)));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
async function boot() {
  try { await Promise.race([Promise.all(['700 72px "Schibsted Grotesk"', '600 40px "Schibsted Grotesk"', '600 60px "IBM Plex Mono"', '400 54px "Young Serif"'].map((f) => document.fonts.load(f))), new Promise((r) => setTimeout(r, 2500))]); } catch { /* fonts optional */ }
  cards.ready(); drawFelt();
  L.resize(camera); addEventListener('resize', () => L.resize(camera));
  L.applyDay(0.755);
  button.position.copy(seats[0].button);
  refreshHud(); frame();
  $('#loading').classList.add('gone');
  const offered = stats.hands === 0 && coach.offerOnce('holdem', {
    title: "New to Texas Hold'em?",
    body: ['A short tutorial plays one practice hand with you and explains every step in plain words. It takes about two minutes, and you can leave it whenever you like.'],
    onYes: () => startTutorial(),
    onNo: () => newHand(),
  });
  if (!offered) setTimeout(newHand, 700);
  window.__holdem = { T, startTutorial, endTutorial, table, TL, rig, setTod: (t) => L.applyDay(t), shown };
}
boot();
</script>
